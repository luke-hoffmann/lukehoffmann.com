<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Flocking Visualization - demo</title>
  <link rel="stylesheet" href="../../_shared/demo.css">
</head>
<body>
  <h1>Bird Flocking Visualization</h1>
  <div id="canvas-insertion-point"></div>
  <div class="controls">
    <button type="button" onclick="reset()">Reset</button>
    <button type="button" id="play-button" onclick="startSimulation()">Play</button>
    <label>Alignment <input type="range" id="alignment-slider" min="0" max="4" value="1" step="0.01" oninput="updateFlockingParameters()"></label>
    <label>Cohesion <input type="range" id="cohesion-slider" min="0" max="4" value="1" step="0.01" oninput="updateFlockingParameters()"></label>
    <label>Separation <input type="range" id="seperation-slider" min="0" max="4" value="1.34" step="0.01" oninput="updateFlockingParameters()"></label>
  </div>
  <script src="../../_shared/p5.min.js"></script>
  <script src="config.js"></script>
  <script src="UsefulFunction.js"></script>
  <script src="Bug.js"></script>
  <script src="bird-flocking-visualization.js"></script>
  <script src="../../_shared/canvasSetup.js"></script>
</body>
</html>
